<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" fill="none">
  <defs>
    <linearGradient id="shell" x1="190" y1="50" x2="480" y2="365" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff"/><stop offset=".38" stop-color="#f5f6f7"/><stop offset=".76" stop-color="#e5e9ed"/><stop offset="1" stop-color="#d2d9df"/>
    </linearGradient>
    <linearGradient id="edge" x1="250" y1="265" x2="290" y2="389" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d9dfe5"/><stop offset=".5" stop-color="#b7c0ca"/><stop offset=".78" stop-color="#d1d8df"/><stop offset="1" stop-color="#a4afbb"/>
    </linearGradient>
    <linearGradient id="key" x1="10" y1="0" x2="48" y2="54" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff"/><stop offset=".36" stop-color="#f8fafb"/><stop offset=".8" stop-color="#e0e5e9"/><stop offset="1" stop-color="#cbd2d9"/>
    </linearGradient>
    <radialGradient id="dish" cx=".55" cy=".15" r=".9">
      <stop stop-color="#c4cdd5" stop-opacity=".65"/><stop offset=".65" stop-color="#f8fafb" stop-opacity=".1"/><stop offset="1" stop-color="#fff" stop-opacity=".9"/>
    </radialGradient>
    <linearGradient id="keySide" x1="0" y1="20" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d2d9df"/><stop offset="1" stop-color="#9aa6b2"/>
    </linearGradient>
    <linearGradient id="bezel" x1="260" y1="222" x2="320" y2="310" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9aa6b2"/><stop offset=".16" stop-color="#e7edf2"/><stop offset=".45" stop-color="#aebac5"/><stop offset="1" stop-color="#fff"/>
    </linearGradient>
    <linearGradient id="display" x1="300" y1="229" x2="300" y2="292" gradientUnits="userSpaceOnUse">
      <stop stop-color="#bec8d2"/><stop offset=".12" stop-color="#e0e6eb"/><stop offset="1" stop-color="#f0f3f5"/>
    </linearGradient>
    <radialGradient id="pin" cx=".32" cy=".25" r=".78">
      <stop stop-color="#fff"/><stop offset=".24" stop-color="#fafcfd"/><stop offset=".6" stop-color="#b7c3ce"/><stop offset=".86" stop-color="#788a9b"/><stop offset="1" stop-color="#e3e9ef"/>
    </radialGradient>
    <radialGradient id="studio"><stop stop-color="#52627a" stop-opacity=".28"/><stop offset="1" stop-color="#52627a" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-.2" y="-.5" width="1.4" height="2"><feGaussianBlur stdDeviation="11"/></filter>
    <filter id="keyShadow" x="-.4" y="-.4" width="1.8" height="2"><feDropShadow dx="1" dy="5" stdDeviation="3" flood-color="#526170" flood-opacity=".28"/></filter>
    <filter id="pinShadow" x="-.6" y="-.6" width="2.2" height="2.5"><feDropShadow dx=".5" dy="1.5" stdDeviation=".7" flood-color="#526170" flood-opacity=".65"/></filter>
    <g id="dotKey">
      <rect x="-2" y="2" width="54" height="62" rx="17" fill="#8d99a6" opacity=".45"/>
      <rect y="4" width="50" height="56" rx="15" fill="url(#keySide)" filter="url(#keyShadow)"/>
      <rect width="50" height="53" rx="15" fill="url(#key)" stroke="#fff" stroke-width="1.2"/>
      <rect x="6" y="5" width="38" height="39" rx="12" fill="url(#dish)"/>
      <path d="M9 8Q25 1 41 8" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
      <ellipse cx="25" cy="39" rx="2.1" ry="1.6" fill="#a6b2be"/><ellipse cx="24.6" cy="38.5" rx="1.2" ry=".8" fill="#f9fcff"/>
    </g>
    <g id="functionKey">
      <rect x="-1" y="3" width="38" height="40" rx="13" fill="#98a4b1" opacity=".5"/>
      <rect y="3" width="36" height="37" rx="12" fill="url(#keySide)" filter="url(#keyShadow)"/>
      <rect width="36" height="35" rx="12" fill="url(#key)" stroke="#fff"/>
      <rect x="5" y="4" width="26" height="25" rx="9" fill="url(#dish)"/>
    </g>
    <g id="cell">
      <rect width="51" height="53" rx="8" fill="#c3cdd6" stroke="#f8fafc" stroke-width=".8"/>
      <rect x="1" y="1" width="49" height="50" rx="7" fill="#e8edf1"/>
      <g fill="#758696" stroke="#f9fbfd" stroke-width=".6">
        <circle cx="17" cy="13" r="4.3"/><circle cx="34" cy="13" r="4.3"/>
        <circle cx="17" cy="26" r="4.3"/><circle cx="34" cy="26" r="4.3"/>
        <circle cx="17" cy="39" r="4.3"/><circle cx="34" cy="39" r="4.3"/>
      </g>
    </g>
    <g id="raised"><circle r="4.15" fill="url(#pin)" filter="url(#pinShadow)"/></g>
  </defs>
  <ellipse cx="389" cy="337" rx="330" ry="76" fill="url(#studio)" transform="rotate(-12 389 337)"/>
  <g transform="translate(23 9) rotate(-14 350 210)">
    <g transform="matrix(1 0 -.17 .78 37 31)">
      <rect x="40" y="84" width="610" height="305" rx="48" fill="#546477" opacity=".2" filter="url(#shadow)"/>
      <rect x="30" y="71" width="620" height="305" rx="48" fill="url(#edge)" stroke="#acb7c2" stroke-width="1.2"/>
      <path d="M32 315Q34 351 79 352H601Q644 350 648 314" stroke="#8896a5" stroke-opacity=".65" stroke-width="1.2"/>
      <path d="M44 336Q54 363 84 364H597Q622 364 636 345" stroke="#eef2f6" stroke-opacity=".8"/>
      <rect x="30" y="40" width="620" height="305" rx="48" fill="url(#shell)" stroke="#fff" stroke-width="2"/>
      <rect x="35" y="45" width="610" height="295" rx="44" stroke="#fff" stroke-opacity=".65"/>
      <path d="M47 91Q47 55 88 55H588" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <path d="M47 302Q51 332 87 332H591Q626 332 635 301" stroke="#c1cad3" stroke-opacity=".7" stroke-width="1.2"/>
      <!-- Six sculpted dot keys, two function keys, and a central space key. -->
      <use href="#dotKey" x="125" y="108"/><use href="#dotKey" x="185" y="90"/><use href="#dotKey" x="245" y="81"/>
      <use href="#dotKey" x="385" y="81"/><use href="#dotKey" x="445" y="90"/><use href="#dotKey" x="505" y="108"/>
      <use href="#functionKey" x="67" y="156"/>
      <path d="M79 173H91m-5-5 5 5-5 5" stroke="#7b8999" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <use href="#functionKey" x="577" y="156"/>
      <path d="m587 173 5-5h10v10h-10l-5-5Zm8-2 4 4m0-4-4 4" stroke="#7b8999" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="282" y="157" width="116" height="47" rx="18" fill="#8d99a6" opacity=".45"/>
      <rect x="284" y="156" width="112" height="44" rx="17" fill="url(#keySide)" filter="url(#keyShadow)"/>
      <rect x="284" y="151" width="112" height="42" rx="17" fill="url(#key)" stroke="#fff" stroke-width="1.3"/>
      <rect x="291" y="156" width="98" height="29" rx="12" fill="url(#dish)"/>
      <path d="M324 178v3h32v-3" stroke="#a1adba" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Recessed three-cell display with individually raised stainless pins. -->
      <rect x="214" y="223" width="252" height="78" rx="21" fill="#fff" opacity=".8"/>
      <rect x="214" y="220" width="252" height="78" rx="21" fill="url(#bezel)"/>
      <rect x="218" y="224" width="244" height="70" rx="18" fill="url(#display)" stroke="#aebbc7" stroke-width=".9"/>
      <use href="#cell" x="246" y="232"/><use href="#cell" x="314" y="232"/><use href="#cell" x="382" y="232"/>
      <g>
        <use href="#raised" x="263" y="245"/><use href="#raised" x="263" y="258"/><use href="#raised" x="280" y="271"/>
        <use href="#raised" x="331" y="245"/><use href="#raised" x="348" y="245"/><use href="#raised" x="331" y="271"/>
        <use href="#raised" x="399" y="258"/><use href="#raised" x="416" y="245"/><use href="#raised" x="416" y="271"/>
      </g>
      <g transform="translate(83 260)" opacity=".65">
        <g stroke="#7b8b9d" stroke-width="1.5" stroke-linejoin="round">
          <path d="M10 2a8 8 0 0 0-8 8c0 2 .7 3.7 2 5.1L2 21l6.7-3.3A8 8 0 1 0 10 2Z"/>
          <circle cx="15" cy="9" r="7.3"/>
        </g>
        <text x="30" y="16" fill="#718196" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" letter-spacing="-.7">EarLink</text>
      </g>
      <rect x="549" y="68" width="27" height="8" rx="4" fill="#c0cbd5" stroke="#fff"/>
      <rect x="551" y="70" width="11" height="4" rx="2" fill="#86b8b4"/>
      <circle cx="586" cy="72" r="2.8" fill="#7da8bf"/><circle cx="585.5" cy="71.5" r="1.2" fill="#c9efff"/>
      <!-- Case seam, inset USB-C connector, and flush assembly screws. -->
      <rect x="453" y="348" width="43" height="13" rx="6.5" fill="#9aa7b4" stroke="#e6edf3" stroke-width="1.2"/>
      <rect x="457" y="350" width="35" height="9" rx="4.5" fill="#293645"/>
      <path d="M463 355h23" stroke="#8793a1" stroke-width="2" stroke-linecap="round"/>
      <g fill="#aab5c0" stroke="#e9eff4" stroke-width=".8">
        <ellipse cx="104" cy="357" rx="4" ry="3"/><ellipse cx="584" cy="357" rx="4" ry="3"/>
      </g>
      <path d="m102 357h4m476 0h4" stroke="#7e8b9a" stroke-width=".8"/>
    </g>
  </g>
